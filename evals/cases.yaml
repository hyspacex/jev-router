            occasionally marks an order paid twice and someone told me it's a missing
            await.

            @router.post("/webhooks/psp")
            async def handle(evt: PspEvent, session: AsyncSession = Depends(get_session)):
                order = await session.get(Order, evt.order_id)
                if order.status == "paid":
                    return {"ok": True}
                if not verify_sig(evt.raw, evt.sig):
                    raise HTTPException(400)
                await ledger.record_payment(order.id, evt.amount_cents, evt.psp_ref)
                order.status = "paid"
                order.paid_at = datetime.now(timezone.utc)
                await session.commit()
                await notify.payment_received(order.id)
