  - id: multilingual-de-mandantenfaehigkeit-156
    slice: multilingual
    language: de
    notes: >
      German multi-tenancy trade-off with real constraints pulling in opposite
      directions: two customers holding most of the data, a 20 minute deploy window
      against 400 schema migrations, and contractual deletion proofs. The user asks for
      a recommendation argued against the alternatives, which is several connected
      stages of reasoning rather than a list of options.
    request:
      messages:
        - role: user
          content: |
            Wir müssen diese Woche entscheiden, wie wir die Mandantenfähigkeit in der
            neuen Plattform umsetzen, und ich komme allein nicht weiter.

            Ausgangslage: rund 400 Kunden, davon zwei, die zusammen etwa 60 Prozent des
            Datenvolumens ausmachen. Postgres 16, eine Instanz, derzeit alles in einem
            Schema mit einer tenant_id-Spalte, aber ohne Row Level Security. Etwa 90
            Tabellen. Drei Kunden aus dem öffentlichen Sektor verlangen vertraglich, dass
            ihre Daten auf Anforderung vollständig und nachweisbar gelöscht werden, und
            zwei weitere fragen regelmäßig nach einem Export ihres kompletten Bestands.

            Zur Debatte stehen drei Varianten: ein Schema pro Mandant, eine Datenbank pro
            Mandant, oder beim gemeinsamen Schema bleiben und Row Level Security
            nachrüsten.

            Was mir Bauchschmerzen macht: bei 400 Schemata läuft jede Migration 400 Mal,
            und unser Deploy-Fenster ist 20 Minuten. Bei RLS habe ich Sorge, dass eine
            einzige vergessene Policy still und leise Daten über Mandantengrenzen hinweg
            ausliefert, und dass wir das erst merken, wenn es ein Kunde merkt.

            Welche Variante würdest du nehmen, und zwar begründet gegen die beiden
            anderen? Mich interessiert besonders, wie die zwei sehr großen Kunden die
            Entscheidung verändern und was aus den Löschnachweisen wird.
      stream: true
    expected:
      task: design-or-review
      difficulty: 3
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: frontier
      effort: high
      acceptable_tiers: [frontier]

