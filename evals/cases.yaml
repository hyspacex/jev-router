  - id: summarise-trial-abstract-66
    notes: >
      MEDICAL summarisation for a clinical audience. Effect sizes, confidence intervals
      and the non-inferiority margin must be reported exactly, and the secondary
      endpoint must not be inflated into a finding. Faithfulness true, frontier.
    request:
      messages:
        - role: system
          content: *sys_pipeline
        - role: user
          content: |
            Summarise for a clinician newsletter in 120 words. Keep all effect sizes and
            intervals. Do not describe secondary endpoints as if they were the primary
            result.

            Background: Oral anticoagulation after catheter ablation for atrial
            fibrillation is commonly continued indefinitely, though the benefit in
            low-risk patients is uncertain.
            Methods: In this open-label, randomised, non-inferiority trial, 2,418 patients
            with CHA2DS2-VASc 1 (men) or 2 (women) and no recurrence at 12 months post
            ablation were assigned 1:1 to continue apixaban or to discontinue. The primary
            endpoint was a composite of stroke, systemic embolism, or cardiovascular death
            at 24 months. The non-inferiority margin was 1.5 for the hazard ratio.
            Results: The primary endpoint occurred in 21 of 1,209 patients (1.7%) in the
            discontinuation group and 17 of 1,209 (1.4%) in the continuation group
            (HR 1.24, 95% CI 0.66–2.33; P for non-inferiority = 0.04). Major bleeding
            occurred in 9 patients (0.7%) versus 27 patients (2.2%) (HR 0.33, 95% CI
            0.16–0.70). All-cause mortality did not differ (2.1% vs 2.0%).
            Limitations: Open-label design; event rates were lower than anticipated,
            widening the confidence interval; patients with recurrence in the first year
            were excluded and the findings do not extend to them.
      stream: false
      temperature: 0.1
