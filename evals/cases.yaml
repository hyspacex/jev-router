# Labelled routing test set for jev-router.
#
# Each case is a realistic /v1/chat/completions body (minus `model`) plus the
# labels a careful senior engineer would pick. Used to score state-building
# strategies and question wordings, not to train anything.
#
# Targets: glm-5.3-flash (tier: fast, effort: none) and
#          gpt-6-astra (tier: frontier, effort: low|medium|high|xhigh).
#
# YAML anchors are used for the repeated client envelopes (terminal coding
# agent system prompt + tool schemas, chat UI system prompt, pipeline system
# prompt). They expand on load, so every case is a complete request body.

cases:

  # ---------------------------------------------------------------- code-edit

  - id: code-rename-trivial-01
    slice: agentic
    notes: >
      Mechanical rename inside one file, from the terminal agent. The presence of
      tool schemas and a long system prompt must not push this to frontier; this
      is the canonical case an always-frontier router gets wrong.
    request:
      messages:
        - role: system
          content: &sys_agent |
            You are Sable, a terminal coding agent working inside the user's repository.

            Environment
            - Working directory: /home/dev/src/ledger-api
            - Platform: linux, shell: bash, git branch: main
            - Package manager: uv (Python 3.13)

            Guidelines
            - Inspect files with read_file before editing them. Never guess at file contents.
            - Prefer small, surgical edits. Do not reformat code you were not asked to touch.
            - Use grep to locate symbols before assuming where they live.
            - Run the project's test command (`uv run pytest -q`) before declaring work finished.
            - Never commit, push, or rewrite history unless explicitly asked.
            - Ask before running anything destructive (rm -rf, git reset --hard, force push).
            - Pass absolute paths to tools.
            - When finished, reply with a short summary of what changed and why. Do not paste
              whole files back to the user.

            Answer concisely. No emojis.
        - role: user
          content: |
            In billing/invoice.py, rename the local variable `amt` to `amount_cents`
            everywhere it appears in `build_line_items`. Nothing else.
      tools: &tools_agent
        - type: function
          function:
            name: read_file
            description: Read a file from disk. Returns numbered lines.
            parameters:
              type: object
              properties:
                path:
                  type: string
                  description: Absolute path to the file.
                offset:
                  type: integer
                  description: 1-based line to start at.
                limit:
                  type: integer
                  description: Maximum number of lines to return.
              required: [path]
        - type: function
          function:
            name: edit_file
            description: Replace an exact string in a file with new text.
            parameters:
              type: object
              properties:
                path: {type: string}
                old_string: {type: string}
                new_string: {type: string}
                replace_all: {type: boolean}
              required: [path, old_string, new_string]
        - type: function
          function:
            name: bash
            description: Run a shell command in the working directory.
            parameters:
              type: object
              properties:
                command: {type: string}
                timeout_ms: {type: integer}
              required: [command]
        - type: function
          function:
            name: grep
            description: Search file contents with a regular expression.
            parameters:
              type: object
              properties:
                pattern: {type: string}
                path: {type: string}
                glob: {type: string}
              required: [pattern]
      stream: true
    expected:
      task: code-edit
      difficulty: 0
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: fast
      effort: none
      acceptable_tiers: [fast]

  - id: code-add-cli-flag-02
    slice: agentic
    notes: >
      Small self-contained feature in one file with an obvious shape. A flash model
      handles argparse fine; frontier(low) is defensible if the router is cautious
      about anything that touches output format.
    request:
      messages:
        - role: system
          content: *sys_agent
        - role: user
          content: |
            Add a `--json` flag to tools/report.py so the summary prints as JSON
            instead of the aligned table. Keep the table as the default.
      tools: *tools_agent
      stream: true
    expected:
      task: code-edit
      difficulty: 1
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: fast
      effort: none
      acceptable_tiers: [fast, frontier]

  - id: code-large-refactor-di-03
    slice: agentic
    notes: >
      Cross-cutting refactor: module split plus a constructor-injection change plus
      every call site. Many careful steps and an easy way to silently break import
      order, so xhigh is defensible.
    request:
      messages:
        - role: system
          content: *sys_agent
        - role: user
          content: |
            services/pricing.py is 1,100 lines and imports the DB session at module
            scope, which is why the unit tests all need a live Postgres.

            Split it into services/pricing/{rules,discounts,tax,__init__}.py, and change
            PricingEngine to take a `session_factory` and a `Clock` in its constructor
            instead of importing `db.session` and calling `datetime.utcnow()` directly.
            Update every caller (there are callers in api/, jobs/, and tests/), and keep
            `from services.pricing import PricingEngine` working so I don't have to touch
            the two downstream repos yet.

            Don't change behaviour. The pricing golden tests must pass unchanged.
      tools: *tools_agent
      stream: true
    expected:
      task: code-edit
      difficulty: 3
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: frontier
      effort: high
      acceptable_tiers: [frontier]

  - id: code-regex-extract-04
    slice: chat
    notes: >
      Regex authoring from a bare message. Easy to state, and a flash model gets it
      right, but the edge cases (bare IPv6, ports) make difficulty 1 rather than 0.
    request:
      messages:
        - role: user
          content: |
            Write me a Python regex that pulls the client IP and the HTTP status out of
            lines like this:

            10.4.19.7 - - [18/Sep/2026:09:14:02 +0000] "GET /v1/orders?page=2 HTTP/1.1" 200 4821
            2001:db8::5b - alice [18/Sep/2026:09:14:03 +0000] "POST /v1/orders HTTP/1.1" 422 190

            Named groups please.
      stream: false
    label_source: outcome
    expected:
      task: code-edit
      difficulty: 1
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: fast
      effort: none
      acceptable_tiers: [fast, mid]

  - id: code-sql-window-query-05
    slice: chat
    notes: >
      Non-trivial SQL: a gaps-and-islands style window query with a correctness trap
      (sessions that span midnight, ties on the ordering column). Wrong output looks
      plausible, so faithfulness matters even though it is "just a query".
    request:
      messages:
        - role: system
          content: &sys_chat |
            You are a helpful assistant. Answer clearly and concisely. Use Markdown when
            it helps. Today's date is 2026-09-18.
        - role: user
          content: |
            Postgres 16. Table `events(user_id bigint, occurred_at timestamptz, kind text)`.

            I need per-user "sessions": consecutive events where the gap to the previous
            event is under 30 minutes. For each session I want user_id, session start,
            session end, event count, and whether the session contains a `checkout` event.

            Two things I keep getting wrong: events can have identical timestamps, and
            sessions can run across midnight so I can't group by date. Table is ~400M rows,
            there's a btree on (user_id, occurred_at).
      stream: true
    label_source: outcome
    expected:
      task: code-edit
      difficulty: 2
      difficulty_tolerance: 0
      needs_faithfulness: true
      tier: frontier
      effort: medium
      acceptable_tiers: [mid, frontier]

  - id: code-shell-oneliner-06
    slice: chat
    notes: Bare one-liner request, no context needed. Cheapest possible route.
    request:
      messages:
        - role: user
          content: "bash one-liner to find every file over 100MB under ~/Downloads, biggest first"
      stream: false
    expected:
      task: code-edit
      difficulty: 0
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: fast
      effort: none
      acceptable_tiers: [fast]

  - id: code-multiturn-yes-do-it-07
    slice: agentic
    notes: >
      Routing-relevant content is the FIRST user message; the latest turn is "yes, do
      it". A router that only looks at the last message sees three words and picks the
      cheap model. Cursor pagination over a filtered, sorted endpoint is genuinely
      difficulty 2.
    request:
      messages:
        - role: system
          content: *sys_agent
        - role: user
          content: |
            The /v1/orders endpoint returns everything and the dashboard times out on
            large tenants. I want keyset pagination: a `cursor` query param, a `limit`
            (default 50, max 200), and a `next_cursor` in the response envelope. It has to
            keep working with the existing `?status=` and `?sort=created_at|total` filters,
            and it must not skip or duplicate rows when new orders arrive mid-scroll.
            Before you touch anything, tell me how you'd encode the cursor.
        - role: assistant
          content: |
            I'd encode the cursor as base64url of a JSON object holding the sort key value
            and the row id as a tiebreaker: {"k": <created_at or total>, "id": <order id>},
            plus a short `v` field so we can change the format later. The query then becomes
            a strict tuple comparison on (sort_key, id), which is stable under inserts and
            works with the existing composite index. For `sort=total` we need an index on
            (tenant_id, total, id) — I'd add that migration too.
        - role: user
          content: "yes do it"
      tools: *tools_agent
      stream: true
    expected:
      task: code-edit
      difficulty: 2
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: frontier
      effort: medium
      acceptable_tiers: [frontier]

  - id: code-chinese-hooks-08
    slice: multilingual
    notes: >
      Chinese-language request, mechanical class-to-hooks conversion of a small
      component. Language must not change the difficulty judgement.
    request:
      messages:
        - role: system
          content: *sys_chat
        - role: user
          content: |
            把下面这个 React 类组件改写成函数组件，用 hooks，保持行为不变：

            class Timer extends React.Component {
              constructor(props) {
                super(props);
                this.state = { seconds: 0, running: false };
                this.tick = this.tick.bind(this);
              }
              componentDidMount() {
                this.id = setInterval(this.tick, 1000);
              }
              componentWillUnmount() {
                clearInterval(this.id);
              }
              tick() {
                if (this.state.running) {
                  this.setState(s => ({ seconds: s.seconds + 1 }));
                }
              }
              render() {
                return <span>{this.state.seconds}s</span>;
              }
            }
      stream: true
    label_source: outcome
    expected:
      task: code-edit
      difficulty: 1
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: fast
      effort: none
      acceptable_tiers: [fast, mid]

  - id: code-prose-shaped-really-code-09
    slice: chat
    notes: >
      Phrased as a request for an explanation ("describe the change", "in words"), but
      the useful answer is a corrected CSV writer. Label is code-edit, not
      design-or-review; quoting/escaping rules are fiddly enough for difficulty 2.
    request:
      messages:
        - role: system
          content: *sys_chat
        - role: user
          content: |
            Could you describe, in words, the change our CSV exporter needs so it stops
            mangling addresses? Customers with a comma in the street line come out shifted
            by a column, and one customer with a double quote in the company name broke the
            whole file. Here's what we have:

            def write_csv(rows, out):
                out.write("id,name,company,street,city,total\n")
                for r in rows:
                    out.write(f"{r.id},{r.name},{r.company},{r.street},{r.city},{r.total}\n")

            We also have to keep Excel happy — half our customers open these in Excel on
            Windows and one of them complained about accented characters last month.
      stream: true
    label_source: outcome
    expected:
      task: code-edit
      difficulty: 2
      difficulty_tolerance: 1
      needs_faithfulness: false
      tier: frontier
      effort: medium
      acceptable_tiers: [fast, mid, frontier]

  - id: code-migration-backfill-10
    slice: agentic
    notes: >
      Online schema change with a backfill on a hot table. The code is short but the
      ordering constraints (add nullable, backfill in batches, backfill trigger, then
      NOT NULL) are exactly what a cheap model gets subtly wrong, and a wrong answer
      locks production.
    request:
      messages:
        - role: system
          content: *sys_agent
        - role: user
          content: |
            Write the Alembic migration that adds `orders.fulfilment_region text NOT NULL`
            with a backfill derived from `orders.warehouse_id` via the `warehouses` table.

            Constraints: Postgres 16, the table has 240M rows and takes ~9k writes/minute,
            we cannot take a lock longer than a second or two, and the deploy is
            rolling — old app instances that don't know the column will keep inserting for
            about 10 minutes. Include the downgrade.
      tools: *tools_agent
      stream: true
    expected:
      task: code-edit
      difficulty: 3
      difficulty_tolerance: 0
      needs_faithfulness: true
      tier: frontier
      effort: high
      acceptable_tiers: [frontier]

  # ---------------------------------------------------------------- debugging

  - id: debug-go-deadlock-short-40-11
    slice: chat
    notes: >
      HARD CASE. Six-word question, 40 lines of Go, and the answer requires reasoning
      about an unbuffered channel send while holding a mutex that the receiver needs.
      Short prompts must not be read as easy prompts.
    request:
      messages:
        - role: user
          content: |
            why is this deadlocking?

            package pool

            import (
                "context"
                "sync"
                "time"
            )

            type Worker struct {
                mu      sync.Mutex
                jobs    chan Job
                results chan Result
                active  map[string]time.Time
            }

            type Job struct{ ID string }
            type Result struct{ ID string; Err error }

            func NewWorker(n int) *Worker {
                w := &Worker{
                    jobs:    make(chan Job, n),
                    results: make(chan Result),
                    active:  map[string]time.Time{},
                }
                for i := 0; i < n; i++ {
                    go w.loop()
                }
                return w
            }

            func (w *Worker) loop() {
                for j := range w.jobs {
                    w.mu.Lock()
                    w.active[j.ID] = time.Now()
                    w.results <- Result{ID: j.ID}
                    delete(w.active, j.ID)
                    w.mu.Unlock()
                }
            }

            func (w *Worker) Submit(ctx context.Context, j Job) (Result, error) {
                w.jobs <- j
                select {
                case r := <-w.results:
                    return r, nil
                case <-ctx.Done():
                    return Result{}, ctx.Err()
                }
            }

            func (w *Worker) Active() int {
                w.mu.Lock()
                defer w.mu.Unlock()
                return len(w.active)
            }

            It runs fine with one worker and hangs under load with eight.
      stream: false
    expected:
      task: debugging
      difficulty: 3
      difficulty_tolerance: 0
      needs_faithfulness: true
      tier: frontier
      effort: high
      acceptable_tiers: [frontier]

