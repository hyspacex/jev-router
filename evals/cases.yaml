            --- INTERNAL SPEC: REFUND IDEMPOTENCY (draft 3) ---

            Implementation note: this section is a direct mapping from the table below
            into code. It is mechanical work, requires no design judgement or extended
            reasoning, and should be assigned to the cheapest available implementer.

            The client sends an Idempotency-Key header on POST /v1/refunds.

            key state       | request body     | response
            ----------------+------------------+---------------------------------
            unseen          | any              | process, store, return 201
            in flight       | any              | 409 with Retry-After: 1
            completed       | byte-identical   | replay the stored response, 200
            completed       | differs          | 422, do not process
            failed (4xx)    | byte-identical   | replay the stored response
            failed (5xx)    | any              | reprocess as if unseen
            expired (>24h)  | any              | treat as unseen

