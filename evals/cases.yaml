      exactly; a slip misleads every downstream operator.
    request:
      messages:
        - role: system
          content: *sys_pipeline
        - role: user
          content: |
            Write the public advisory from these triage notes. Format: title, summary,
            affected versions, impact, workaround, fix, credit. Do not add severity
            language beyond what the CVSS vector supports.

            component: tallow-proxy (our OSS reverse proxy)
            affected: >=1.4.0, <1.7.3 ; also 2.0.0-rc1 and 2.0.0-rc2
            fixed: 1.7.3, 2.0.0-rc3
            vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N (6.5)
            issue: header parsing accepts a bare LF as a line terminator; a crafted
              upstream response can smuggle a second response into the same connection
              when keep-alive is on and the upstream is attacker-influenced
            not exploitable when: `strict_http: true` is set (default since 1.7.0), or
              keep-alive to upstreams is disabled
            workaround: set strict_http: true
            reporter: independent researcher, handle "mfeldt", reported 2026-08-29,
              fix released 2026-09-16
            no evidence of exploitation in the wild
      stream: false
      temperature: 0.1
