  - id: multiturn-idempotency-drilldown-145
    slice: multiturn
    notes: >
      DRILL-DOWN on an idempotency key design. The first turns settle the easy parts,
      and the latest turn asks the case that actually decides the design: a retry with
      the same key and a different body while the original request is still in flight.
      Answering it requires reasoning about uniqueness windows, response replay and
      what the client is allowed to observe.
    request:
      messages:
        - role: system
          content: *sys_chat
        - role: user
          content: |
            We're adding idempotency keys to POST /v1/payments. Client sends
            Idempotency-Key, we store it, second request with the same key returns the
            first response. Is there anything more to it than that?
        - role: assistant
          content: |
            That is the shape, yes. The parts people underestimate are scope (a key is
            unique per API key and per endpoint, not globally), retention (how long you
            promise to replay, and what happens on the first request after that window),
            and what you store: the response body and status, or enough to rebuild them.
        - role: user
          content: |
            Scope per API key and per endpoint, fine. We'll keep keys for 24 hours and
            return 400 if a key is reused after that with a different body. Storing the
            serialised response body and status in a `idempotency_records` table next to
            the payment.
        - role: assistant
          content: |
            Reasonable. One thing to pin down: the record has to be written in the same
            transaction as the payment, otherwise a crash between the two gives you a
            payment with no record, and the retry creates a second payment. That single
            constraint rules out putting the records in Redis, which is where most people
            start.
        - role: user
          content: |
            Here's the one I can't resolve. Client sends key K with body A. It takes 8
            seconds because the acquirer is slow. At second 3 the client's own timeout
            fires and it retries key K, but a bug on their side means the retry carries
            body B with a different amount.

            So: request one is still in flight and holds no committed row yet, request two
            arrives, bodies differ, and we have no stored response to replay. What do we
            return to request two, what do we return to request one when it finishes, and
            how do we make that decision without holding a database lock for 8 seconds?
            I also need to know what the client can legitimately conclude from each answer,
            because we're going to write it into the API docs.
      stream: true
    expected:
      task: design-or-review
      difficulty: 3
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: frontier
      effort: high
      acceptable_tiers: [frontier]

  - id: multiturn-node-memory-drilldown-146
    slice: multiturn
    notes: >
      DRILL-DOWN with no system message. The conversation narrows from "the pods
