  - id: agent-monorepo-dep-bump-32
    notes: >
      Another "yes do it" latest turn, this time on a genuinely large agentic job
      (breaking major bump across nine packages with a codemod). First message plus the
      assistant's plan carry the weight.
    request:
      messages:
        - role: system
          content: *sys_agent
        - role: user
          content: |
            Bump us from Pydantic 1 to 2 across the monorepo. Nine packages, about 300
            models, and two of them use custom validators with `values` and root
            validators. I want the plan first.
        - role: assistant
          content: |
            Plan: (1) inventory every BaseModel and validator with grep, splitting them into
            mechanical (field types only), semi-mechanical (@validator → @field_validator),
            and hand-written (root validators using `values`, custom __init__, Config
            classes with unusual options). (2) Run bump-pydantic as a first pass on the
            mechanical set, per package, one commit each. (3) Hand-convert the root
            validators to @model_validator(mode="after"), which changes when they run —
            that's where behaviour can shift. (4) Replace .dict()/.json()/parse_obj call
            sites. (5) Run each package's tests between steps; the shared fixtures package
            has to go first since everything imports it.
        - role: user
          content: "continue"
      tools: *tools_agent
      stream: true
    expected:
      task: agentic-tool-task
      difficulty: 3
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: frontier
      effort: high
      acceptable_tiers: [frontier]

