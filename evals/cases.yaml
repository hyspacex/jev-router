  # ------------------------------------------------------------- longcontext
  #
  # The material is too long to type into this file, so these cases carry a
  # `generated:` block instead of a `request:` block and `evals/generators.py`
  # expands it from the seed. Same seed, same bytes. The `ask` is written by
  # hand and is the part the label is about.

  - id: longctx-incident-root-cause-162
    slice: longcontext
    notes: >
      Two hours of logs across five services, and the question is the real one an
      on-call engineer asks: which failure came first and what links the rest to it.
      Nothing can be answered by reading the head or the tail, so this is the case
      that punishes a router that only looks at the first field of the state.
    generated:
      generator: incident_log
      seed: 11
      chars: 45000
      envelope: chat
      placement: after
      ask: |
        Here's the export from the incident on the 14th. Two questions.

        Which service started failing first, and is everything else downstream of it
        or did we have two separate problems? I have to write the postmortem this
        afternoon and I don't want to blame the wrong team again.
    expected:
      task: debugging
      difficulty: 3
      difficulty_tolerance: 0
      needs_faithfulness: true
      tier: frontier
      effort: xhigh
      acceptable_tiers: [frontier]

  - id: longctx-log-last-error-163
    slice: longcontext
    notes: >
      The long-paste trap at full size. Forty thousand characters of log and the
      question is a single lookup that needs no reasoning at all. A router that
      reads length as difficulty sends this to the frontier model at high effort.
    generated:
      generator: incident_log
      seed: 4
      chars: 40000
      envelope: pipeline
      placement: after
      ask: |
        Print the detail field of the last ERROR line and nothing else.
    expected:
      task: summarise-or-extract
      difficulty: 0
      difficulty_tolerance: 0
      needs_faithfulness: true
      tier: fast
      effort: none
      acceptable_tiers: [fast]

