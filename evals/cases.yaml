            quick one, why won't this compile? I feel like I'm missing something obvious

            struct Graph {
                nodes: Vec<Node>,
                edges: Vec<(usize, usize)>,
            }

            struct Node {
                id: usize,
                label: String,
                degree: usize,
            }

            impl Graph {
                fn recompute_degrees(&mut self) {
                    for n in self.nodes.iter_mut() {
                        n.degree = 0;
                    }
                    for (a, b) in self.edges.iter() {
                        self.nodes[*a].degree += 1;
                        self.nodes[*b].degree += 1;
                    }
                }

                fn relabel(&mut self) {
                    for n in self.nodes.iter_mut() {
                        n.label = self.label_for(n.id);
                    }
                }

                fn label_for(&self, id: usize) -> String {
                    format!("n{}", id)
                }
            }
