  - id: design-auth-module-review-23
    notes: >
      A 150-line auth module with several planted, genuinely independent flaws (JWT
      algorithm not pinned, non-constant-time token compare, SQL built by string
      interpolation in one path, session id not rotated on login, secret defaulting to
      a literal). Finding all of them needs sustained reading, and missing one is a
      security hole, so faithfulness is true and effort is high.
    request:
      messages:
        - role: system
          content: *sys_pipeline
        - role: user
          content: |
            Security review the module below. List every issue you find with the line it
            is on, an exploit sketch, and the fix. Rank by severity.

            # auth/session.py
            import base64
            import hashlib
            import json
            import os
            import secrets
            import time
            from dataclasses import dataclass
            from typing import Optional

            import jwt
            import psycopg
            from flask import current_app, g, request

            JWT_SECRET = os.environ.get("JWT_SECRET", "dev-secret-change-me")
            SESSION_TTL = 60 * 60 * 24 * 30
            RESET_TTL = 60 * 60 * 2
            PEPPER = "b6f1"


            @dataclass
            class Principal:
                user_id: int
                tenant_id: int
                email: str
                roles: list
                session_id: str


            def _conn():
                return psycopg.connect(current_app.config["DATABASE_URL"])


            def hash_password(password: str, salt: Optional[str] = None) -> str:
                salt = salt or secrets.token_hex(8)
                digest = hashlib.sha256((salt + PEPPER + password).encode()).hexdigest()
                return f"{salt}${digest}"


            def check_password(password: str, stored: str) -> bool:
                salt, digest = stored.split("$", 1)
                candidate = hashlib.sha256((salt + PEPPER + password).encode()).hexdigest()
                return candidate == digest


            def issue_token(principal: Principal) -> str:
                payload = {
                    "sub": principal.user_id,
                    "tid": principal.tenant_id,
                    "email": principal.email,
                    "roles": principal.roles,
                    "sid": principal.session_id,
                    "iat": int(time.time()),
                    "exp": int(time.time()) + SESSION_TTL,
                }
                return jwt.encode(payload, JWT_SECRET, algorithm="HS256")


            def decode_token(token: str) -> dict:
                return jwt.decode(token, JWT_SECRET, options={"verify_signature": True})


            def login(email: str, password: str) -> Optional[Principal]:
                with _conn() as conn:
                    with conn.cursor() as cur:
                        cur.execute(
                            "SELECT id, tenant_id, email, password_hash, roles, locked_until "
                            "FROM users WHERE lower(email) = lower(%s)",
                            (email,),
                        )
                        row = cur.fetchone()
                if row is None:
                    return None
                user_id, tenant_id, stored_email, password_hash, roles, locked_until = row
                if locked_until and locked_until > time.time():
                    return None
                if not check_password(password, password_hash):
                    _record_failure(user_id)
                    return None
                session_id = request.cookies.get("sid") or secrets.token_urlsafe(24)
                _store_session(user_id, session_id)
                return Principal(user_id, tenant_id, stored_email, list(roles), session_id)


            def _record_failure(user_id: int) -> None:
                with _conn() as conn:
                    with conn.cursor() as cur:
                        cur.execute(
                            "UPDATE users SET failed_logins = failed_logins + 1 WHERE id = %s",
                            (user_id,),
                        )


            def _store_session(user_id: int, session_id: str) -> None:
                with _conn() as conn:
                    with conn.cursor() as cur:
                        cur.execute(
                            "INSERT INTO sessions (id, user_id, created_at) "
                            "VALUES (%s, %s, now()) ON CONFLICT (id) DO NOTHING",
                            (session_id, user_id),
                        )


            def current_principal() -> Optional[Principal]:
                header = request.headers.get("Authorization", "")
                if not header.startswith("Bearer "):
                    return None
                try:
                    claims = decode_token(header[7:])
                except jwt.PyJWTError:
                    return None
                return Principal(
                    user_id=claims["sub"],
                    tenant_id=claims["tid"],
                    email=claims["email"],
                    roles=claims.get("roles", []),
                    session_id=claims.get("sid", ""),
                )


            def require_role(role: str) -> bool:
                p = current_principal()
                if p is None:
                    return False
                if "admin" in p.roles:
                    return True
                return role in p.roles


            def make_reset_token(user_id: int) -> str:
                raw = json.dumps({"u": user_id, "e": int(time.time()) + RESET_TTL})
                body = base64.urlsafe_b64encode(raw.encode()).decode().rstrip("=")
                sig = hashlib.md5((body + JWT_SECRET).encode()).hexdigest()[:16]
                return f"{body}.{sig}"


            def use_reset_token(token: str) -> Optional[int]:
                body, _, sig = token.partition(".")
                expected = hashlib.md5((body + JWT_SECRET).encode()).hexdigest()[:16]
                if sig != expected:
                    return None
                padding = "=" * (-len(body) % 4)
                data = json.loads(base64.urlsafe_b64decode(body + padding))
                if data["e"] < time.time():
                    return None
                return data["u"]


            def audit(event: str, principal: Principal, detail: str) -> None:
                with _conn() as conn:
                    with conn.cursor() as cur:
                        cur.execute(
                            "INSERT INTO audit_log (event, user_id, tenant_id, detail) "
                            f"VALUES ('{event}', {principal.user_id}, "
                            f"{principal.tenant_id}, '{detail}')"
                        )


            def logout() -> None:
                p = getattr(g, "principal", None)
                if p is None:
                    return
                with _conn() as conn:
                    with conn.cursor() as cur:
                        cur.execute("DELETE FROM sessions WHERE id = %s", (p.session_id,))
      stream: false
      temperature: 0.2
    expected:
      task: design-or-review
      difficulty: 3
      difficulty_tolerance: 0
      needs_faithfulness: true
      tier: frontier
      effort: high
      acceptable_tiers: [frontier]

