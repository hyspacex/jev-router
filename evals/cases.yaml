  - id: multiturn-outbox-carry-on-137
    slice: multiturn
    notes: >
      The conversation warms up with a yes/no design question, then turns into a full
      implementation plan for a transactional outbox. The latest turn is two words,
      but what it approves is a new table, a dispatcher with lease-based claiming, a
      retry ladder and a contract change for 40 customer endpoints. The label follows
      the work being continued, not the length of the last message.
    request:
      messages:
        - role: system
          content: *sys_agent
        - role: user
          content: |
            We keep losing webhook deliveries when a pod gets killed mid-request. Is an
            outbox table overkill for our size? We do maybe 200k events a day.
        - role: assistant
          content: |
            Not overkill. At 200k a day the table stays small if you prune delivered rows,
            and it buys you the thing you actually want: the event is durable the moment
            the business transaction commits, so a pod dying is a delayed delivery rather
            than a lost one. The alternative, retrying in-process, cannot survive SIGKILL.
        - role: user
          content: |
            Right, let's do it properly then. Postgres 16, the API is FastAPI, deliveries
            go out to about 40 customer endpoints and some of them are flaky for hours at
            a time. Plan it out before you touch anything.
        - role: assistant
          content: |
            Here is how I would do it. Nothing below adds more than one insert to the
            request path.

            1. Add a table in the same database as the business data, so the insert and
               the domain write share one transaction:

               CREATE TABLE webhook_outbox (
                   id           bigserial PRIMARY KEY,
                   endpoint_id  uuid NOT NULL REFERENCES webhook_endpoints(id),
                   event_type   text NOT NULL,
                   payload      jsonb NOT NULL,
                   created_at   timestamptz NOT NULL DEFAULT now(),
                   available_at timestamptz NOT NULL DEFAULT now(),
                   attempts     int NOT NULL DEFAULT 0,
                   locked_by    text,
                   locked_at    timestamptz,
                   delivered_at timestamptz,
                   last_error   text
               );
               CREATE INDEX webhook_outbox_ready_idx
                   ON webhook_outbox (available_at)
                   WHERE delivered_at IS NULL;

            2. Replace the direct httpx call in services/notify.py with an insert into
               webhook_outbox. The function keeps its current signature so no caller
               changes. The one behaviour difference is that it stops raising when a
               customer endpoint is down, which two callers currently catch.

            3. New dispatcher in jobs/dispatch_webhooks.py. It claims work with
               SELECT ... FOR UPDATE SKIP LOCKED, batches of 100, ordered by
               available_at. Claiming writes locked_by (the pod name) and locked_at, so a
               pod that dies leaves rows we can reclaim once the 5 minute lease expires.

            4. Retry ladder: attempts 1 through 8, available_at = now() plus 2^attempts
               seconds with jitter, capped at 15 minutes. After attempt 8 the row stays
               undelivered and shows up in a dead letter view that support can read.

            5. Delivery becomes at-least-once, so every request carries an idempotency
               header derived from the row id. That is a contract change and we have to
               tell the 40 endpoint owners before it ships.

            6. Housekeeping: a nightly job deletes delivered rows older than 30 days, plus
               a gauge for the age of the oldest undelivered row. At our volume that gauge
               is the only alert worth having.

            Open question before I start: do you want the dispatcher in the API deployment
            or as its own pod?
        - role: user
          content: "its own pod. carry on"
      tools: *tools_agent
      stream: true
    expected:
      task: agentic-tool-task
      difficulty: 3
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: frontier
      effort: high
      acceptable_tiers: [frontier]

  - id: multiturn-ratelimiter-continue-138
    slice: multiturn
    notes: >
      The assistant was midway through a sliding-window rate limiter and stopped inside
      the Lua script, and the latest user turn is a bare "continue". Finishing it means
      getting the window arithmetic, the Redis round trips and the header values right,
      which is real work even though the remaining code is short.
    request:
      messages:
        - role: system
          content: *sys_chat
        - role: user
          content: |
            Is a fixed-window rate limiter actually bad, or is that just something people
            say? We're on Express with Redis.
        - role: assistant
          content: |
            It is bad in one specific way: a client can send the full quota at the end of
            one window and the full quota at the start of the next, so a 100/minute limit
            allows 200 requests in a two second span. If your limit exists to protect a
            downstream service, that burst is exactly what you were trying to prevent.
            A sliding window fixes it for the cost of a little more bookkeeping.
        - role: user
          content: |
            Fine, write me the sliding window one. TypeScript, ioredis, 100 requests per
            minute per API key, and I need the standard RateLimit headers on every
            response including the rejected ones.
        - role: assistant
          content: |
            Sliding window counter, two buckets, one round trip. The Lua keeps the read and
            the increment atomic so concurrent requests cannot both see the same count.

            ```ts
            import Redis from "ioredis";
            import type { Request, Response, NextFunction } from "express";

            const redis = new Redis(process.env.REDIS_URL!);

            const WINDOW_MS = 60_000;
            const LIMIT = 100;

            type Verdict = {
              allowed: boolean;
              remaining: number;
              resetSeconds: number;
            };

            // KEYS[1] current bucket, KEYS[2] previous bucket
            // ARGV[1] elapsed fraction of the current window, ARGV[2] limit,
            // ARGV[3] bucket ttl in seconds
            const SCRIPT = `
              local cur  = tonumber(redis.call("GET", KEYS[1]) or "0")
              local prev = tonumber(redis.call("GET", KEYS[2]) or "0")
              local elapsed = tonumber(ARGV[1])
              local limit = tonumber(ARGV[2])
              local ttl = tonumber(ARGV[3])

              local weighted = prev * (1 - elapsed) + cur

              if weighted + 1 > limit then
                return {0, cur, prev}
              end

              local newCur = redis.call("INCR", KEYS[1])
              if newCur == 1 then
                redis.call("EXPIRE", KEYS[1], ttl)
              end
              return {1, newCur, prev}
            `;

            function bucketKey(apiKey: string, index: number): string {
              return `rl:${apiKey}:${index}`;
            }

            export async function check(apiKey: string): Promise<Verdict> {
              const now = Date.now();
              const index = Math.floor(now / WINDOW_MS);
              const elapsed = (now % WINDOW_MS) / WINDOW_MS;

              const [allowed, cur, prev] = (await redis.eval(
                SCRIPT,
                2,
                bucketKey(apiKey, index),
                bucketKey(apiKey, index - 1),
                String(elapsed),
                String(LIMIT),
                String(Math.ceil((WINDOW_MS * 2) / 1000)),
              )) as [number, number, number];

              // remaining and reset still to compute from cur, prev and elapsed
            ```
        - role: user
          content: "continue"
      stream: true
    label_source: outcome
    expected:
      task: code-edit
      difficulty: 2
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: frontier
      effort: medium
      acceptable_tiers: [mid, frontier]

  - id: multiturn-schema-review-rest-139
    slice: multiturn
    notes: >
      A schema review that the assistant deliberately split, covering four of seven
      tables and naming the three it has not reached. "yes do the rest" asks for the
      same quality of review on subscriptions, invoices and refunds, which are the
      three with the most money-shaped edge cases. Review work, not editing, so the
      task is design-or-review.
    request:
      messages:
        - role: user
          content: |
            We're rewriting the billing schema before we add usage pricing and I want a
            second pair of eyes. Seven tables: accounts, plans, entitlements, usage_events,
            subscriptions, invoices, refunds. Want me to paste the DDL?
        - role: assistant
          content: |
            Paste it, and tell me two things alongside it: roughly what volume each table
            takes in a month, and whether anything downstream reads these tables directly
            rather than going through the API.
        - role: user
          content: |
            Volumes: accounts 40k rows total, plans 30, entitlements ~200k, usage_events
            about 90M a month, subscriptions 45k, invoices 40k a month, refunds maybe 300
            a month. The data team reads invoices and usage_events directly from a replica.

            Go through all seven. I care most about anything that gets painful at five
            times the current volume, and anything where we could end up billing someone
            twice.
        - role: assistant
          content: |
            Going in order. I have covered four below and will do the rest after.

            accounts
            - `status` as a free-text column with six values in practice is the kind of
              thing that acquires a seventh by accident. Make it an enum or a check
              constraint, and decide now whether "cancelled" and "closed" are different.
            - There is no `deleted_at` and the data team reads a replica, so a hard delete
              will make historical invoices point at nothing. Soft delete this one.

            plans
            - 30 rows, so nothing here is a performance question. But `price_cents integer`
              with no currency column means you can never sell in a second currency without
              a migration that touches every invoice. Add `currency char(3)` now.
            - Versioning is missing. When a plan's price changes, every subscription on it
              silently reprices. You want plan_versions with a validity window, and
              subscriptions pointing at a version rather than a plan.

            entitlements
            - 200k rows keyed by (account_id, feature) is fine, but the lookup happens on
              every API request, so this belongs behind a cache with an explicit
              invalidation on write rather than a per-request select.
            - `limit_value integer NULL` meaning unlimited is a trap. Half your call sites
              will forget the null check. Use a sentinel or a separate boolean.

            usage_events
            - 90M a month unpartitioned is the single biggest problem here. Partition by
              month on occurred_at before this gets any larger, because doing it later
              means a rewrite with the table under write load.
            - There is no idempotency key. If the ingest retries, you double count usage
              and bill twice, which is the exact failure you said you care about. A unique
              constraint on (source, external_id) costs one index and removes the class.
            - Storing the full event payload as jsonb alongside the extracted quantity
              doubles the table size. Keep the payload for 30 days in a side table.

            That is accounts, plans, entitlements and usage_events. Subscriptions, invoices
            and refunds are the three where the money logic actually lives, and I have not
            touched them yet.
        - role: user
          content: "yes do the rest"
      stream: true
    expected:
      task: design-or-review
      difficulty: 2
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: frontier
      effort: medium
      acceptable_tiers: [frontier]

