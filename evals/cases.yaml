  # -------------------------------------------------------- everyday-polish

  - id: polish-docstring-tidy-53
    slice: agentic
    notes: >
      HARD CASE. Arrives through the coding agent, full of code and tool schemas, but
      the work is copy-editing prose inside docstrings. Any state builder that says
      "code present → code-edit" mislabels this. Cheap tier is right.
    request:
      messages:
        - role: system
          content: *sys_agent
        - role: user
          content: |
            Tidy the docstrings in utils/dates.py — they're inconsistent (some start with
            "Returns", some with "This function returns", one is a sentence fragment) and
            two of them have typos. Don't change any code, just the text. Google style,
            imperative mood.

            def business_days_between(start, end, holidays=None):
                """This function returns the number of buisness days between two dates,
                excluding weekends and any holidays passed in."""

            def next_billing_date(anchor, months=1):
                """next billing date after anchor, clamped to the last day of the month
                if the anchor day doesn't exist (e.g. 31st in Februrary)"""

            def to_utc(dt, tz):
