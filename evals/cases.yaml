  # ---------------------------------------------------- summarise-or-extract

  - id: summarise-meeting-notes-dates-61
    notes: >
      HARD CASE. Long, messy notes where dates were revised mid-meeting (the freeze
      moves twice, and one deadline is stated in two formats). Getting a date wrong
      propagates into a release plan, so faithfulness is true and the cheap tier is not
      acceptable even though "summarise notes" sounds easy.
    request:
      messages:
        - role: system
          content: *sys_pipeline
        - role: user
          content: |
            Summarise the notes below into: decisions, owners with dates, open questions.
            Where the notes contradict themselves, say so rather than picking one.

            Release planning — 2026-09-15, 14:00–15:20 CEST
            Present: Priya (eng lead), Marek (platform), Sofia (QA), Dan (support), Yuki (PM)
            Apologies: Rafa (design) — Yuki to relay

            Yuki: recap, we're shipping 3.0 with the new billing screens and the audit log.
            Original plan was code freeze Fri 2026-10-02, RC on the 6th, GA on the 13th.

            Marek: platform can't do the 2nd. The Postgres 16 upgrade lands the week of the
            28th and he won't stack a freeze on top of it. Suggests pushing freeze a week.

            Priya: billing screens are already at risk, two of the four are behind. If we
            push the freeze she'd rather use the week for the audit log than for billing.

            Sofia: QA needs eight working days between freeze and GA, not five. With a
            freeze on the 9th, GA can't be the 13th.

            — discussion —

            Decision 1: code freeze moves from Fri 2026-10-02 to Fri 2026-10-09.
            Decision 2: GA moves from 2026-10-13 to Tue 2026-10-27. Yuki notes that's
            twelve working days after freeze, which gives QA slack for one re-test cycle.

            Dan: support can't absorb a GA in the last week of October, that's when the
            annual renewals go out. Asks for the first week of November.

            Yuki: won't move it again. Offers to hold the in-app announcement until
            2026-11-03 so support's inbox doesn't spike on renewal week. Dan accepts.

            Decision 3: RC build on 2026-10-14, not the 6th. Marek builds it.
            (Sofia later says she has the RC in her calendar as the 15th — Yuki to check
            the invite; the notes above and the calendar disagree.)

            Decision 4: the audit log ships in 3.0. Billing screens: two of four ship, the
            other two go to 3.1. Priya to say which two by end of week (2026-09-19).

            Decision 5: Postgres 16 upgrade stays in the week of 2026-09-28, with the
            production cutover on Thursday 2026-10-01 at 02:00 CEST. Marek owns it.
            Rollback window is two hours. If it slips past Friday the 2nd, the freeze slips
            with it and we revisit GA.

            Open: do we need a migration for the audit log retention setting, or is the
            default 90 days fine for Enterprise? Nobody knew. Priya to ask legal.
            Open: who writes the customer-facing release notes? Yuki thinks Rafa agreed to
            the screenshots but not the copy. To confirm with Rafa.
            Open: Sofia asked whether the 3.1 billing screens need their own QA cycle or
            can ride the 3.0 regression pack. Parked.

            AOB: Dan flagged that three Enterprise customers are still on 2.8 and the audit
            log needs 2.9+. Yuki: not a blocker for GA, but someone has to tell them. No
            owner assigned.

            Next meeting: Mon 2026-09-22, same time.
      stream: false
      temperature: 0
    expected:
      task: summarise-or-extract
      difficulty: 2
      difficulty_tolerance: 0
      needs_faithfulness: true
      tier: frontier
      effort: medium
      acceptable_tiers: [frontier]

