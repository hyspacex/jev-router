  - id: multiturn-tls-then-curl-flag-141
    slice: multiturn
    notes: >
      TASK SWITCH. Four turns of a genuinely awkward TLS chain problem, then the user
      drops it and asks for a curl flag. The latest turn is a one-line lookup that any
      model answers correctly, so the label is quick-question at difficulty 0 and the
      cheap route is the right one. A router anchored on the conversation overspends.
    request:
      messages:
        - role: system
          content: *sys_chat
        - role: user
          content: |
            Our Java service can't talk to a partner API. It works from curl on the same
            host. Error is PKIX path building failed: unable to find valid certification
            path to requested target.
        - role: assistant
          content: |
            That combination almost always means the partner is serving an incomplete
            chain. curl works because the system trust store on that host happens to have
            the intermediate cached or the OS fetches it; the JVM trust store will not do
            either. Check what the server actually sends with
            openssl s_client -connect host:443 -showcerts and count the certificates.
        - role: user
          content: |
            You're right, it sends the leaf only. The intermediate is a cross-signed one
            from a CA we do have the root for. So do I add the intermediate to our
            truststore, or is that the wrong fix?
        - role: assistant
          content: |
            Adding the intermediate works and is what most people do, but it is a fix with
            an expiry date: when the partner rotates to a new intermediate you break again,
            silently, at whatever hour their cert renews. The durable fix is to get them to
            serve the full chain, which is a one-line change in their web server config.
            Do both, with the truststore entry as the thing you remove once they ship.
        - role: user
          content: "actually hold on, what's the flag to make curl follow redirects?"
      stream: true
    expected:
      task: quick-question
      difficulty: 0
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: fast
      effort: none
      acceptable_tiers: [fast]

