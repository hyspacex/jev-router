  - id: multiturn-flaky-test-narrowing-144
    slice: multiturn
    notes: >
      DRILL-DOWN. Each turn removes a possibility until the last one asks the real
      question: why an unawaited task left by one test only poisons a specific later
      test on a shared module-scoped event loop, and how to fix it without serialising
      the suite. That requires reasoning about asyncio teardown order, not a checklist.
    request:
      messages:
        - role: system
          content: *sys_agent
        - role: user
          content: |
            One of our tests fails about 1 in 30 CI runs and never fails locally. I've been
            ignoring it for a month and I'd like to stop.
        - role: assistant
          content: |
            Two things worth knowing before guessing: which test, and whether the failure
            is the same assertion every time. If CI uses pytest-randomly and your machine
            does not, ordering is the usual suspect, and you can reproduce it by pulling
            the seed out of the failing run's header and passing -p randomly -randomly-seed
            with that value.
        - role: user
          content: |
            Same assertion every time. It's tests/test_settlement.py::test_batch_totals,
            and it asserts the batch total is 48200 but gets 0. Ran it with the CI seed and
            it does reproduce: it only fails when it runs after
            tests/test_export.py::test_stream_large_export.
        - role: assistant
          content: |
            So it is order-dependent, and the export test is leaving something behind.
            Usual candidates are a patched module attribute that is not restored, a
            global cache, or an open async resource. Check whether the export test starts
            anything it does not await.
        - role: user
          content: |
            Found it. test_stream_large_export does this:

                task = asyncio.create_task(drain(stream))
                async for chunk in stream:
                    body += chunk
                assert len(body) > 10_000

            and never awaits or cancels `task`. Our conftest has

                @pytest.fixture(scope="module")
                def event_loop():
                    loop = asyncio.new_event_loop()
                    yield loop
                    loop.close()

            What I don't understand: that orphan task can't touch settlement at all, it
            only reads from the export stream. But test_batch_totals gets 0 rather than
