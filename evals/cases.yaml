  - id: multilingual-zh-hikari-timeout-153
    slice: multilingual
    language: zh
    notes: >
      Chinese prose wrapped around an English Java stack trace. The real diagnosis is
      that an outbound HTTP call sits inside a @Transactional method, so each slow
      upstream request holds a pooled connection for the whole call, which is why the
      database itself never looks busy. Several pieces of evidence have to be joined up
      and a wrong answer sends the team to resize the pool instead.
    request:
      messages:
        - role: system
          content: *sys_chat
        - role: user
          content: |
            线上从昨天下午开始间歇性报这个错，大概十几分钟一次。重启服务之后能安稳一两个小时，
            然后又开始。我们用的是 Spring Boot 3.3 加 HikariCP，maximum-pool-size 设的是 20，
            但 DBA 那边看数据库的活动连接数一直在 12 上下，根本没打满。

            java.sql.SQLTransientConnectionException: HikariPool-1 - Connection is not available, request timed out after 30000ms.
                at com.zaxxer.hikari.pool.HikariPool.createTimeoutException(HikariPool.java:696)
                at com.zaxxer.hikari.pool.HikariPool.getConnection(HikariPool.java:197)
                at com.zaxxer.hikari.pool.HikariDataSource.getConnection(HikariDataSource.java:100)
                at org.springframework.jdbc.datasource.DataSourceUtils.fetchConnection(DataSourceUtils.java:160)
                at org.springframework.jdbc.datasource.DataSourceUtils.doGetConnection(DataSourceUtils.java:118)
                at org.springframework.orm.jpa.vendor.HibernateJpaDialect.beginTransaction(HibernateJpaDialect.java:169)
                at org.springframework.orm.jpa.JpaTransactionManager.doBegin(JpaTransactionManager.java:421)
                at org.springframework.transaction.support.AbstractPlatformTransactionManager.startTransaction(AbstractPlatformTransactionManager.java:531)
                at com.nordhavn.ledger.settlement.SettlementService.confirm(SettlementService.java:88)
                at com.nordhavn.ledger.api.SettlementController.postConfirm(SettlementController.java:54)

            补充三点：
            1. 出问题的 confirm 方法上面有 @Transactional，方法体里会调一次外部风控系统的
               HTTP 接口。对方上周换了新网关，我们的 read timeout 配的是 30 秒，connect
               timeout 没配。
            2. 每天下午两点跑一个对账定时任务，跑的时候这个错会明显变多。
            3. 上周把 maximum-pool-size 从 10 调到 20 之后，报错的频率只降了一点点。

            到底是连接池不够用，还是别的地方有问题？给我一个判断依据，别只列可能性。
      stream: true
    expected:
      task: debugging
      difficulty: 3
      difficulty_tolerance: 0
      needs_faithfulness: true
      tier: frontier
      effort: high
      acceptable_tiers: [frontier]

