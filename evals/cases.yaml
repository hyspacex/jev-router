            - Entre el 1 y el 14 de septiembre de 2026 se les cobró dos veces la cuota
              mensual de 14.300 €: un cargo el día 1 y otro el día 9.
            - El segundo cargo lo provocó un reintento automático de nuestra pasarela tras
