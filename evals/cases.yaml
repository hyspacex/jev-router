  - id: summarise-blogpost-tldr-63
    slice: pipeline
    notes: Three-bullet tl;dr of an ordinary opinion piece. No stakes, cheap.
    request:
      messages:
        - role: system
          content: *sys_pipeline
        - role: user
          content: |
            tl;dr in three bullets:

            Every team I've worked with eventually builds a "temporary" script that becomes
            load-bearing. It starts as one person's shell alias, grows a flag, grows a
            config file, and eighteen months later the deploy depends on it and nobody
            knows who owns it. The problem isn't that the script exists — the problem is
            that it never crossed a line that would have forced anyone to treat it as
            software. It has no tests, no owner, no changelog, and no way to run it twice
            safely. My rule now is simple: the moment a script is run by someone who didn't
            write it, it gets a README and a name in the CODEOWNERS file. That's a five
            minute tax that buys you the right to delete it later, because you can finally
            tell who would notice.
      stream: false
    expected:
      task: summarise-or-extract
      difficulty: 0
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: fast
      effort: none
      acceptable_tiers: [fast]

