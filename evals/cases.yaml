  - id: multiturn-query-then-comment-150
    slice: multiturn
    notes: >
      GETS EASIER inside the coding agent. The hard part, a gaps-and-islands query with
      a deliberate tiebreak, is already written and accepted. The latest turn asks for a
      two-line comment above it, which is mechanical description of code that is sitting
      right there in the conversation.
    request:
      messages:
        - role: system
          content: *sys_agent
        - role: user
          content: |
            I need a query that finds, per warehouse, the longest run of consecutive days
            with zero outbound shipments in the last year. Table is
            shipments(warehouse_id int, shipped_on date, units int).
        - role: assistant
          content: |
            The trick is to generate the full date range rather than working from the rows
            you have, because a warehouse with no shipments at all has no rows to group.

            WITH days AS (
                SELECT generate_series(
                    current_date - interval '1 year',
                    current_date,
                    interval '1 day'
                )::date AS d
            ),
            grid AS (
                SELECT w.warehouse_id, days.d
                FROM (SELECT DISTINCT warehouse_id FROM shipments) w
                CROSS JOIN days
            ),
            flagged AS (
                SELECT g.warehouse_id,
                       g.d,
                       (s.warehouse_id IS NULL) AS idle
                FROM grid g
                LEFT JOIN shipments s
                       ON s.warehouse_id = g.warehouse_id
                      AND s.shipped_on = g.d
            ),
            runs AS (
                SELECT warehouse_id,
                       d,
                       d - (row_number() OVER (PARTITION BY warehouse_id, idle ORDER BY d))::int AS grp
                FROM flagged
                WHERE idle
            )
            SELECT warehouse_id,
                   min(d) AS run_start,
                   max(d) AS run_end,
                   count(*) AS idle_days
            FROM runs
            GROUP BY warehouse_id, grp
            ORDER BY idle_days DESC;

            Note the LEFT JOIN can produce more than one row per day if a warehouse ships
            twice, which does not affect the idle flag but does mean you should not reuse
            `flagged` for any counting.
        - role: user
          content: |
            Checked it against last quarter by hand and it matches. Put it in
            reports/idle_warehouses.sql.
        - role: assistant
          content: |
            Written to /home/dev/src/ledger-api/reports/idle_warehouses.sql, unchanged from
            what you approved above.
        - role: user
          content: "add a two line comment at the top saying what it does, same style as the other files in reports/"
      tools: *tools_agent
      stream: true
    expected:
      task: code-edit
      difficulty: 0
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: fast
      effort: none
      acceptable_tiers: [fast]

