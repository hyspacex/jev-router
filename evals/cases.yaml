            for the largest one. The retainer path is the part that identifies the owner.
        - role: user
          content: |
            Top three by delta: Array +214MB, Object +88MB, Timeout +31MB.

            Two retainer paths that both look plausible to me:

            (a) Array -> pending -> RetryQueue -> module scope of lib/retry.js
            (b) Array -> _events.finish -> ServerResponse -> Socket -> Server

            The Timeout count went from 4,100 to 39,800 over the 40 minutes, and we do
