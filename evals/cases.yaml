  - id: multilingual-fr-plan-explain-160
    slice: multilingual
    language: fr
    notes: >
      French debugging with an English EXPLAIN ANALYZE plan pasted in. The plan shows a
      backward index scan on created_at discarding 8.8M rows instead of using the GIN
      index, and the preprod copy behaves differently, so the answer has to join the
      plan, the statistics and the environment difference. The user explicitly rules
      out a list of possibilities and wants a diagnosis before an on-call shift.
    request:
      messages:
        - role: system
          content: *sys_chat
        - role: user
          content: |
            Depuis la migration en Postgres 16 la semaine dernière, cette requête est
            passée de 40 ms à presque 7 secondes, et uniquement en production. En préprod,
            sur une copie de la base de la veille, elle reste à 45 ms. J'ai relancé un
            ANALYZE sur les trois tables concernées, ça n'a rien changé.

            La requête :

                SELECT o.id, o.total_cents, c.name
                FROM orders o
                JOIN customers c ON c.id = o.customer_id
                WHERE o.metadata @> '{"channel": "marketplace"}'
                  AND o.created_at >= now() - interval '30 days'
                ORDER BY o.created_at DESC
                LIMIT 50;

            Le plan en production :

            Limit  (cost=0.43..912.77 rows=50 width=48) (actual time=6821.113..6821.140 rows=50 loops=1)
              ->  Nested Loop  (cost=0.43..219441.02 rows=12023 width=48) (actual time=6821.111..6821.133 rows=50 loops=1)
                    ->  Index Scan Backward using orders_created_at_idx on orders o  (cost=0.43..205118.77 rows=12023 width=24) (actual time=6821.088..6821.096 rows=50 loops=1)
                          Filter: ((metadata @> '{"channel": "marketplace"}'::jsonb) AND (created_at >= (now() - '30 days'::interval)))
                          Rows Removed by Filter: 8814662
                    ->  Index Scan using customers_pkey on customers c  (cost=0.00..1.19 rows=1 width=32) (actual time=0.000..0.000 rows=1 loops=50)
                          Index Cond: (id = o.customer_id)
            Planning Time: 0.402 ms
            Execution Time: 6821.201 ms

            Précisions : il existe bien un index GIN sur orders.metadata, créé il y a six
            mois, et il apparaît dans pg_indexes en production. La table orders fait 41
            millions de lignes en production contre 3 millions en préprod, et seulement
            0,4 % des commandes ont channel = marketplace.

            Pourquoi le planificateur ignore l'index GIN, pourquoi ça ne se voit pas en
            préprod, et qu'est-ce que je corrige en premier ? Je suis d'astreinte ce soir,
            donc j'ai besoin d'un diagnostic, pas d'une liste de pistes.
      stream: true
    expected:
      task: debugging
      difficulty: 3
      difficulty_tolerance: 0
      needs_faithfulness: true
      tier: frontier
      effort: high
      acceptable_tiers: [frontier]

  - id: multilingual-pt-coorte-retencao-161
    slice: multilingual
    language: pt
    notes: >
      European Portuguese request for a cohort retention query with two stated traps:
      customers who cancel and resubscribe, and empty cells in the grid. The shape has
      to be worked out (generate the month grid, define active on the last day, avoid
      double counting reactivations) before any SQL is written, which puts it at
      difficulty 2.
    request:
      messages:
        - role: system
          content: *sys_chat
        - role: user
          content: |
            Preciso de uma consulta em Postgres 16 para o relatório de retenção por coorte
            e estou a empatar na parte dos meses sem actividade.

            Tabelas:
            assinaturas(id bigint, cliente_id bigint, iniciada_em date, cancelada_em date
            null, plano text)
            faturas(id bigint, cliente_id bigint, emitida_em date, valor_cents int,
            estado text)

            O que quero: para cada mês de coorte, ou seja o mês da primeira assinatura do
            cliente, quantos clientes continuavam activos no mês 0, 1, 2 e assim por diante
            até ao mês 12, e a percentagem em relação ao tamanho da coorte. Um cliente
            conta como activo num mês se tinha uma assinatura sem cancelamento no último
            dia desse mês, independentemente de ter fatura emitida.

            Dois pormenores que me têm estragado os números: há clientes que cancelaram e
            voltaram a assinar meses depois, e não quero buracos na grelha quando nenhum
            cliente de uma coorte esteve activo num determinado mês. Saída em formato
            longo, uma linha por coorte e por número do mês.
      stream: true
    label_source: outcome
    expected:
      task: code-edit
      difficulty: 2
      difficulty_tolerance: 0
      needs_faithfulness: false
      tier: frontier
      effort: medium
      acceptable_tiers: [mid, frontier]
