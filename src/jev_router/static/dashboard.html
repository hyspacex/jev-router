<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jev-router inspector</title>
  <link rel="preload" href="/dashboard/assets/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/dashboard/assets/dashboard.css">
  <script src="/dashboard/assets/dashboard.js" defer></script>
  <script src="/dashboard/assets/overview.js" defer></script>
  <script src="/dashboard/assets/rules.js" defer></script>
  <script src="/dashboard/assets/inspector.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="wrap">
      <header class="bar">
        <button id="home" class="brand" type="button">jev-router</button>
        <nav id="views" class="tabs" aria-label="Views" hidden>
          <a id="v-overview" class="tab" href="#overview" title="Overview (o)">Overview</a>
          <a id="v-sessions" class="tab" href="#sessions" title="Sessions (s)">Sessions</a>
          <a id="v-rules" class="tab" href="#rules" title="Rules (r)">Rules</a>
        </nav>
        <div class="right">
          <div id="cfg" class="cfg" role="status"></div>
          <span id="keys" class="kbd" tabindex="0" role="note" title="Keyboard: o overview, s sessions, r rules, / search sessions, j k next and previous row (or session, on a session page), [ ] previous and next turn, Esc back to the list" aria-label="Keyboard: o overview, s sessions, r rules, / search sessions, j k next and previous row (or session, on a session page), [ ] previous and next turn, Esc back to the list" hidden>?</span>
          <button id="pause" class="ghost" type="button" hidden>Pause</button>
          <button id="disconnect" class="ghost" type="button" hidden>Disconnect</button>
          <form id="auth" class="auth" autocomplete="off">
            <label class="sr" for="token">Router admin token</label>
            <input id="token" type="password" autocomplete="off" placeholder="admin token" spellcheck="false">
            <button id="connect" class="ghost primary" type="submit">Connect</button>
          </form>
        </div>
      </header>
      <p id="error" class="gaprow" role="alert" hidden></p>
      <main id="main"></main>
    </div>
  </div>
</body>
</html>
