<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jev-router inspector</title>
  <link rel="preload" href="/dashboard/assets/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/dashboard/assets/dashboard.css">
  <script src="/dashboard/assets/dashboard.js" defer></script>
  <script src="/dashboard/assets/overview.js" defer></script>
  <script src="/dashboard/assets/rules.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="wrap">
      <header class="bar">
        <button id="home" class="mark" type="button">jev-router</button>
        <nav id="views" class="views" aria-label="Views" hidden>
          <a id="v-overview" class="view" href="#overview" title="o">Overview</a>
          <a id="v-sessions" class="view" href="#sessions" title="s">Sessions</a>
          <a id="v-rules" class="view" href="#rules" title="r">Rules</a>
        </nav>
        <div class="tools">
          <form id="auth" class="auth" autocomplete="off">
            <label class="sr" for="token">Router admin token</label>
            <input id="token" type="password" autocomplete="off" placeholder="admin token" spellcheck="false">
            <button id="connect" type="submit">Connect</button>
          </form>
          <div id="cfg" class="cfg" role="status"></div>
          <button id="pause" class="ghost" type="button" hidden>Pause</button>
          <button id="disconnect" class="ghost" type="button" hidden>Disconnect</button>
        </div>
      </header>
      <p id="error" class="gaprow" role="alert" hidden></p>
      <main id="main"></main>
    </div>
  </div>
</body>
</html>
