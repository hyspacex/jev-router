[project]
name = "jev-router"
version = "0.1.0"
description = "Routing shim in front of an OpenAI-compatible proxy, using TypeSafe Jev to pick the model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.41",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
jev-router = "jev_router.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "respx>=0.21",
]
# Only evals/import_public.py needs these. The router does not.
evals = [
    "datasets>=3.0",
    "huggingface-hub>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_router"]

# Eval scripts are executable modules; tests add this path at runtime too.
[tool.pyright]
extraPaths = ["src", "evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
